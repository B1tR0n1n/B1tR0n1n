# Builds the gold contribution snake and publishes it to the `output` branch.
# Runs daily, on every push to main, and on demand (Actions tab -> Run workflow).
name: Generate contribution snake

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs (b1tr0n1n palette)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#c9a227&color_dots=#161410,#3d362c,#5c4c1a,#8b7320,#c9a227
            dist/snake-light.svg?color_snake=#8b7320&color_dots=#ebe6da,#d8cdb0,#c2a967,#a88a24,#8b7320

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
