<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="84" viewBox="0 0 1200 84" role="img" aria-label="02 — Projects"><title>02 — Projects</title><defs><style>@font-face{font-family:'JetBrains Mono';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'JetBrains Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}text{font-feature-settings:'lnum' 1,'pnum' 1}
.grow{transform-origin:48px 50px;transform:scaleX(0);animation:gr .9s .3s cubic-bezier(.2,.7,.2,1) forwards}
