<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="B1tR0n1n — Keith Burns. IT Operations Engineer, Field Systems Division."><title>B1tR0n1n — Keith Burns. IT Operations Engineer, Field Systems Division.</title><defs><style>@font-face{font-family:'JetBrains Mono';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Cormorant Garamond';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Cormorant Garamond';font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'JetBrains Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}text{font-feature-settings:'lnum' 1,'pnum' 1}
