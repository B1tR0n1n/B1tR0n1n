<svg xmlns="http://www.w3.org/2000/svg" width="590" height="270" viewBox="0 0 590 270" role="img" aria-label="infra-toolkit — Field scripts"><title>infra-toolkit — Field scripts</title><defs><style>@font-face{font-family:'JetBrains Mono';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'JetBrains Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Cormorant Garamond';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Cormorant Garamond';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}text{font-feature-settings:'lnum' 1,'pnum' 1}.blink{animation:bl 1.1s steps(1) infinite}@keyframes bl{50%{opacity:0}}</style><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2a2620" stroke-width="1"/></pattern><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter></defs><rect width="590" height="270" fill="#0a0908"/><rect width="590" height="270" fill="url(#grid)" opacity="0.35"/><rect width="590" height="270" filter="url(#noise)" opacity="0.035"/><rect x="0.5" y="0.5" width="589" height="269" fill="none" stroke="#2a2620"/><path d="M12 22V12H22 M568 12H578V22 M578 248V258H568 M22 258H12V248" fill="none" stroke="#3d362c" stroke-width="1"/><text x="36" y="48" class="f d1" font-family="JetBrains Mono" font-weight="500" font-size="10" fill="#8b7320" letter-spacing="4" text-anchor="start" >P-03</text><text x="554" y="48" class="f d1" font-family="JetBrains Mono" font-weight="400" font-size="10" fill="#7a7060" letter-spacing="3" text-anchor="end" >FIELD SCRIPTS</text><text x="36" y="96" class="f d2" font-family="Cormorant Garamond" font-weight="700" font-size="40" fill="#ede5d0" letter-spacing="-1" text-anchor="start" >infra-toolkit</text><rect x="36" y="112" width="40" height="1" fill="#c9a227" class="f d3"/><text x="36" y="146" class="f d3" font-family="Cormorant Garamond" font-weight="400" font-size="19" fill="#c8bda0" letter-spacing="0" text-anchor="start" >PowerShell from the floor: endpoint status, SCCM</text><text x="36" y="173" class="f d3" font-family="Cormorant Garamond" font-weight="400" font-size="19" fill="#c8bda0" letter-spacing="0" text-anchor="start" >cache, disk reports, software and AD lookups —</text><text x="36" y="200" class="f d3" font-family="Cormorant Garamond" font-weight="400" font-size="19" fill="#c8bda0" letter-spacing="0" text-anchor="start" >built across fifteen thousand endpoints.</text><rect x="24" y="218" width="542" height="1" fill="#2a2620"/><text x="36" y="244" class="f d4" font-family="JetBrains Mono" font-weight="400" font-size="10" fill="#7a7060" letter-spacing="2.5" text-anchor="start" >POWERSHELL  ·  SCCM  ·  ACTIVE DIRECTORY</text><text x="536" y="244" class="f d4" font-family="JetBrains Mono" font-weight="500" font-size="10" fill="#c9a227" letter-spacing="2.5" text-anchor="end" >STABLE</text><rect class="blink" x="544" y="235" width="5" height="10" fill="#c9a227"/></svg>