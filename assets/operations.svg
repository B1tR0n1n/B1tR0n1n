<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="About Keith Burns"><title>About Keith Burns</title><defs><style>@font-face{font-family:'Cormorant Garamond';font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Cormorant Garamond';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'JetBrains Mono';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'JetBrains Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}text{font-feature-settings:'lnum' 1,'pnum' 1}</style><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2a2620" stroke-width="1"/></pattern><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter></defs><rect width="1200" height="300" fill="#0a0908"/><rect width="1200" height="300" fill="url(#grid)" opacity="0.35"/><rect width="1200" height="300" filter="url(#noise)" opacity="0.035"/><rect x="740" y="40" width="1" height="220" fill="#2a2620"/><text x="48" y="92" class="f d1" font-family="Cormorant Garamond" font-weight="600" font-size="34" fill="#ede5d0" letter-spacing="-0.5" text-anchor="start" >I keep fleets running.</text><text x="48" y="148" class="f d3" font-family="Cormorant Garamond" font-weight="400" font-size="21" fill="#c8bda0" letter-spacing="0" text-anchor="start" >Endpoint management, provisioning and PowerShell automation —</text><text x="48" y="180" class="f d4" font-family="Cormorant Garamond" font-weight="400" font-size="21" fill="#c8bda0" letter-spacing="0" text-anchor="start" >the quiet work that decides whether a company has a good day.</text><text x="48" y="212" class="f d5" font-family="Cormorant Garamond" font-weight="400" font-size="21" fill="#c8bda0" letter-spacing="0" text-anchor="start" >Then I build the tools I wish the job came with: models that</text><text x="48" y="244" class="f d5" font-family="Cormorant Garamond" font-weight="400" font-size="21" fill="#c8bda0" letter-spacing="0" text-anchor="start" >reason about failure, and sandboxes that keep agents honest.</text><text x="780" y="78" class="f d3" font-family="JetBrains Mono" font-weight="500" font-size="10" fill="#8b7320" letter-spacing="3" text-anchor="start" >ROLE</text><text x="880" y="78" class="f d4" font-family="JetBrains Mono" font-weight="400" font-size="11" fill="#c8bda0" letter-spacing="1.5" text-anchor="start" >IT OPERATIONS ENGINEER</text><text x="780" y="112" class="f d3" font-family="JetBrains Mono" font-weight="500" font-size="10" fill="#8b7320" letter-spacing="3" text-anchor="start" >FOCUS</text><text x="880" y="112" class="f d4" font-family="JetBrains Mono" font-weight="400" font-size="11" fill="#c8bda0" letter-spacing="1.5" text-anchor="start" >ENDPOINTS · AUTOMATION</text><text x="780" y="146" class="f d3" font-family="JetBrains Mono" font-weight="500" font-size="10" fill="#8b7320" letter-spacing="3" text-anchor="start" ></text><text x="880" y="146" class="f d4" font-family="JetBrains Mono" font-weight="400" font-size="11" fill="#c8bda0" letter-spacing="1.5" text-anchor="start" >AI-ENHANCED INFRASTRUCTURE</text><text x="780" y="180" class="f d3" font-family="JetBrains Mono" font-weight="500" font-size="10" fill="#8b7320" letter-spacing="3" text-anchor="start" >SERVICE</text><text x="880" y="180" class="f d4" font-family="JetBrains Mono" font-weight="400" font-size="11" fill="#c8bda0" letter-spacing="1.5" text-anchor="start" >USMC — COMBAT VETERAN</text><text x="780" y="214" class="f d3" font-family="JetBrains Mono" font-weight="500" font-size="10" fill="#8b7320" letter-spacing="3" text-anchor="start" >BASE</text><text x="880" y="214" class="f d4" font-family="JetBrains Mono" font-weight="400" font-size="11" fill="#c8bda0" letter-spacing="1.5" text-anchor="start" >INDIANA, USA</text><text x="780" y="248" class="f d3" font-family="JetBrains Mono" font-weight="500" font-size="10" fill="#8b7320" letter-spacing="3" text-anchor="start" >OS</text><text x="880" y="248" class="f d4" font-family="JetBrains Mono" font-weight="400" font-size="11" fill="#c8bda0" letter-spacing="1.5" text-anchor="start" >WINDOWS · LINUX</text></svg>